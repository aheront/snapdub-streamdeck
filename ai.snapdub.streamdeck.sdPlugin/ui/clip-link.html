<!doctype html>
<html>
	<head lang="en">
		<title>Make clips</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<style>
			/* Plain text outside the sdpi controls keeps the browser default black, unreadable on the dark panel. */
			p, summary, details { color: #d8d8d8; }
			summary { cursor: pointer; }
		</style>
	</head>
	<body>
		<sdpi-item label="Account">
			<div>
				<p id="signin-status">Checking...</p>
				<button id="signin-button" class="sdpi-item-value">Sign in with SnapDub</button>
			</div>
		</sdpi-item>

		<sdpi-item label="Link">
			<sdpi-textfield setting="link" placeholder="Empty: use the copied link"></sdpi-textfield>
		</sdpi-item>

		<sdpi-item label="Clips">
			<sdpi-select setting="clips" default="">
				<option value="">Default</option>
				<option value="3">3</option>
				<option value="6">6</option>
				<option value="10">10</option>
				<option value="15">15</option>
				<option value="20">20</option>
				<option value="30">30</option>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item label="Template">
			<sdpi-select setting="template" datasource="getTemplates" hot-reload loading="Loading..." default=""></sdpi-select>
		</sdpi-item>

		<details class="sdpi-item">
			<summary>How it works</summary>
			<p>Copy a stream or video link (YouTube, Twitch, Kick, Rumble or Zoom) and press the key. It shows the progress, and once the clips are ready, pressing it again opens them.</p>
		</details>

		<script src="signin.js"></script>
	</body>
</html>
